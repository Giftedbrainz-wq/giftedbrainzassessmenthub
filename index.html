<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="assets/icon.png" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css?v=51.2.0" />
  <link rel="stylesheet" href="eduspace-ui.css?v=50.8.0-contrast" />
  <link rel="stylesheet" href="baskerville-centered.css?v=50.8.0-contrast" />
  <link rel="stylesheet" href="premium-interface.css?v=50.8.0-contrast" />
  <link rel="stylesheet" href="button-contrast.css?v=50.8.0" />
  <link rel="stylesheet" href="unified-typography.css?v=50.9.0" />

<link rel="stylesheet" href="study-mode-v51.2.css?v=51.2.0">
  <link rel="stylesheet" href="gifted-brand-enhancements-v51.3.css?v=51.3.0">
  <link rel="stylesheet" href="refinements-v51.4.css?v=51.4.0">

  <link rel="stylesheet" href="study-ai-richtext-v51.6.css?v=51.6.0">
</head>
<body>
  <div id="app"><div class="startup-fallback"><strong>Gifted Brainz Assessment Hub</strong><span>Loading…</span></div></div>
  <div id="modalRoot"></div>
  <div id="studentOverlay"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <script>
    window.pdfjsReady = import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs')
      .then(mod => {
        window.pdfjsLib = mod;
        if (mod.GlobalWorkerOptions) mod.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
        return mod;
      })
      .catch(error => { console.warn('PDF reader unavailable', error); return null; });
  </script>
  <script>
    (function () {
      function showBootError() {
        if (window.__gbBooted) return;
        var app = document.getElementById('app');
        if (app && !app.querySelector('.app-shell') && !app.querySelector('.login-wrap') && !app.querySelector('.student-landing') && !app.querySelector('.cbt-shell') && !app.querySelector('.gb-fullscreen-loading')) {
          app.innerHTML = '<div class="startup-fallback startup-error"><strong>Gifted Brainz could not load</strong><span>Please refresh the page. If the problem continues, check the EdgeOne deployment.</span></div>';
        }
      }
      window.addEventListener('error', function (event) {
        if (event && event.target && event.target !== window) {
          var target = event.target;
          var tag = String(target.tagName || '').toLowerCase();
          var id = String(target.id || '');
          // Ignore passive image/CSS resource failures, but surface a failed main app bundle.
          if (id === 'gbAppScript') { showBootError(); return; }
          if (tag === 'img' || tag === 'link') return;
          return;
        }
        showBootError();
      });
      window.addEventListener('unhandledrejection', function () {
        showBootError();
      });
    })();
  </script>
  <script defer src="study-ai-format-v51.6.js?v=51.6.0"></script>
  <script id="gbAppScript" defer src="app.js?v=51.6.0"></script>
  <script defer src="channel-prompt.js?v=50.8.0"></script>
</body>
</html>
