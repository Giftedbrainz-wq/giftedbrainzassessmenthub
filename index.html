<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B2D5C" />
  <meta name="description" content="Gifted Brainz Assessment Hub — professional online CBT platform and shareable Brainz Biltz challenges." />
  <title>Gifted Brainz Assessment Hub</title>
  <link rel="icon" href="assets/gifted-brainz-logo-cropped.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
  <link rel="stylesheet" href="styles.css?v=v51.0-eduspace-bridge-20261101" />
</head>
<body>
  <script>
    (function () {
      try {
        if (localStorage.getItem('gb_admin_theme') === 'dark') document.body.classList.add('admin-theme');
        if (localStorage.getItem('gb_student_theme') === 'dark') document.body.classList.add('student-dark');
      } catch (_) {}
    })();
  </script>
  <div id="app"><div class="startup-fallback"><strong>Gifted Brainz Assessment Hub</strong><span>Loading…</span></div></div>
  <div id="modalRoot"></div>
  <div id="studentOverlay"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <script>
    window.pdfjsReady = import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs')
      .then(mod => {
        window.pdfjsLib = mod;
        if (mod.GlobalWorkerOptions) mod.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
        return mod;
      })
      .catch(error => { console.warn('PDF reader unavailable', error); return null; });
  </script>
  <script>
    (function () {
      function showBootError() {
        if (window.__gbBooted) return;
        var app = document.getElementById('app');
        if (app && !app.querySelector('.app-shell') && !app.querySelector('.login-wrap') && !app.querySelector('.student-landing') && !app.querySelector('.cbt-shell')) {
          app.innerHTML = '<div class="startup-fallback startup-error"><strong>Gifted Brainz could not load</strong><span>Please refresh the page. If the problem continues, check the EdgeOne deployment.</span></div>';
        }
      }
      window.addEventListener('error', function (event) {
        if (event && event.target && event.target !== window) {
          var target = event.target;
          var tag = String(target.tagName || '').toLowerCase();
          var id = String(target.id || '');
          // Ignore passive image/CSS resource failures, but surface a failed main app bundle.
          if (id === 'gbAppScript') { showBootError(); return; }
          if (tag === 'img' || tag === 'link') return;
          return;
        }
        showBootError();
      });
      window.addEventListener('unhandledrejection', function () {
        showBootError();
      });
    })();
  </script>
  <script id="gbAppScript" defer src="app.js?v=v51.0-eduspace-bridge-20261101"></script>
</body>
</html>
